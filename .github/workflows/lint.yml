name: lint

on: [pull_request]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Lint
        run: make lint
      - name: Lint protobuf/grpc
        run: make proto-lint
      # buf breaking needs BSR auth to resolve the module, and secrets aren't
      # available to fork-originated pull requests, or to PRs opened by
      # dependabot[bot] (even from a same-repo branch), so only run it for
      # PRs from branches within this repo opened by someone other than
      # dependabot.
      - name: Log in to Buf Schema Registry
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        run: echo "${{ secrets.BUF_TOKEN }}" | buf registry login --token-stdin
      - name: Check for breaking protobuf/grpc changes
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        run: make proto-breaking
