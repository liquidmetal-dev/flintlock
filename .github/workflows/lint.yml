name: lint

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: Lint
        run: make lint
      - name: Lint protobuf/grpc
        run: make proto-lint
      # buf breaking needs BSR auth to resolve the module, and secrets aren't
      # available to fork-originated pull requests, or to PRs opened by
      # dependabot[bot] (even from a same-repo branch), so only run it for
      # PRs from branches within this repo opened by someone other than
      # dependabot.
      - name: Log in to Buf Schema Registry
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: echo "${BUF_TOKEN}" | buf registry login --token-stdin
      - name: Check for breaking protobuf/grpc changes
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        run: make proto-breaking
