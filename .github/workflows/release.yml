name: release

on:
  push:
    tags:
    - "v*.*.*"

jobs:
  # test:
  #   runs-on: ubuntu-latest
  #   env:
  #     PROJECT_NAME: "flintlock_release_e2e"
  #   steps:
  #   - uses: actions/checkout@v2
  #   - name: Run e2es
  #     env:
  #       METAL_AUTH_TOKEN: ${{ secrets.METAL_AUTH_TOKEN }}
  #     run: |
  #       pip3 install -r test/tools/requirements.txt
  #       test/tools/run.py run-e2e -o ${{ secrets.EQUINIX_ORG_ID }} -p ${{ env.PROJECT_NAME }}
  #   - name: Cleanup project
  #     uses: weaveworks/metal-janitor-action@27a0594c5c92d85585b553fc0c5ef2a3de7bec95
  #     with:
  #       metal_auth_token: ${{ secrets.METAL_AUTH_TOKEN }}
  #       project_names: ${{ env.PROJECT_NAME }}
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
    # The pinned mkfs.erofs is attached to the release next to the Go
    # binaries. GoReleaser picks it up through release.extra_files in
    # .goreleaser.yaml. flintlock-provision erofs-utils downloads it from there.
    - name: Build pinned mkfs.erofs
      id: erofs
      uses: ./.github/actions/erofs-utils
      with:
        cache: false
    - name: Stage mkfs.erofs release assets
      run: |
        mkdir -p bin/erofs-utils
        cp "${{ steps.erofs.outputs.asset-dir }}"/mkfs.erofs-* bin/erofs-utils/
        ls -l bin/erofs-utils
    - name: Run GoReleaser
      run: goreleaser release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish the overlay initrd image
      # The image is tagged with the release tag (v0.16.0) and with the
      # version GoReleaser puts into flintlockd (0.16.0, no v), which is the
      # tag flintlockd derives its default initrd image from.
      run: make push-overlay-initrd-image OVERLAY_INITRD_TAGS="${TAG} ${TAG#v}"
      env:
        TAG: ${{ github.ref_name }}
    - name: Log in to Buf Schema Registry
      run: echo "${{ secrets.BUF_TOKEN }}" | buf registry login --token-stdin
    - name: Push schema to Buf Schema Registry
      run: buf push --tag "${{ github.ref_name }}"
