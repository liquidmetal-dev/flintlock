name: commitlint

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Check PR title follows Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-messages:
    name: Check commit messages follow Conventional Commits
    runs-on: ubuntu-latest
    # Dependabot's generated commit subjects (e.g. "Bump foo from 1.0 to 2.0")
    # always trip the subject-case rule, so this check is meaningless for it.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
