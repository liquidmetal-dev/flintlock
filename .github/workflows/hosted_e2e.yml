name: hosted e2e

on:
  workflow_dispatch:
    inputs:
      firecracker_version:
        description: "Firecracker release tag to install"
        required: false
        default: "v1.16.1"
      cloud_hypervisor_version:
        description: "Cloud Hypervisor release tag to install"
        required: false
        default: "v48.0"
      containerd_version:
        description: "containerd release tag to install"
        required: false
        default: "v2.2.9"
      zot_version:
        description: "zot release tag to install"
        required: false
        default: "v2.1.21"

permissions:
  contents: read

concurrency:
  group: hosted-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            curl \
            lvm2 \
            skopeo \
            thin-provisioning-tools \
            wget

      - name: Install containerd
        env:
          CONTAINERD: ${{ github.event.inputs.containerd_version || 'v2.2.9' }}
        run: |
          tarball="containerd-${CONTAINERD#v}-linux-amd64.tar.gz"
          url="https://github.com/containerd/containerd/releases/download/${CONTAINERD}"

          cd "$(mktemp -d)"
          curl -fsSLO "${url}/${tarball}"
          curl -fsSLO "${url}/${tarball}.sha256sum"
          sha256sum -c "${tarball}.sha256sum"
          sudo tar -C /usr/local -xzf "${tarball}"

          # The runner image ships its own containerd, make sure that the one
          # which the tests will pick up from the PATH is the one just installed.
          command -v containerd
          containerd --version
          containerd --version | grep -F " ${CONTAINERD} "

      - name: Install zot
        env:
          ZOT: ${{ github.event.inputs.zot_version || 'v2.1.21' }}
        run: |
          binary="zot-linux-amd64-minimal"
          url="https://github.com/project-zot/zot/releases/download/${ZOT}"

          cd "$(mktemp -d)"
          curl -fsSLO "${url}/${binary}"
          curl -fsSLO "${url}/checksums.sha256.txt"
          grep -E " \*?${binary}\$" checksums.sha256.txt | sha256sum -c -
          sudo install -m 0755 "${binary}" /usr/local/bin/zot

          zot --version

      - name: Install Firecracker
        env:
          FIRECRACKER: ${{ github.event.inputs.firecracker_version || 'v1.16.1' }}
        run: sudo -E ./hack/scripts/provision.sh firecracker

      - name: Install Cloud Hypervisor
        env:
          CLOUD_HYPERVISOR: ${{ github.event.inputs.cloud_hypervisor_version || 'v48.0' }}
        run: |
          sudo -E ./hack/scripts/provision.sh cloudhypervisor

          command -v cloud-hypervisor-static
          cloud-hypervisor-static --version

          # The script does not compare the version of the binary with the one
          # which was asked for. The binary of the tag v48.0 reports v48.0.0,
          # and the one of the tag v53.0 reports v53.0.
          if [[ "${CLOUD_HYPERVISOR}" == "latest" ]]; then
            echo "The version of the latest release is not known, it is not compared."
          else
            installed="$(cloud-hypervisor-static --version)"
            wanted="cloud-hypervisor ${CLOUD_HYPERVISOR}"

            if [[ "${installed}" != "${wanted}" && "${installed}" != "${wanted}.0" ]]; then
              echo "Expected '${wanted}', the installed binary is '${installed}'." >&2
              exit 1
            fi
          fi

      - name: Verify KVM access
        run: |
          if [[ ! -c /dev/kvm ]]; then
            echo "/dev/kvm not found. GitHub-hosted e2e tests require KVM." >&2
            exit 1
          fi

          ls -l /dev/kvm

          if command -v lscpu >/dev/null 2>&1; then
            lscpu | grep -E "Virtualization|Hypervisor|Vendor ID|Model name" || true
          fi

      - name: Run e2e tests
        run: |
          sudo env \
            "PATH=$PATH" \
            "GOCACHE=/tmp/go-cache" \
            "GOMODCACHE=/tmp/go-mod" \
            make test-e2e

      - name: Cleanup e2e resources
        if: always()
        run: |
          # A VMM is not a child of flintlockd. If a test left one behind, it
          # holds on to the devices of the thinpool until it has exited.
          vmms='(firecracker|cloud-hypervisor-static) .*/var/lib/flintlock/vm/'

          sudo pkill -f "${vmms}" || true

          for _ in $(seq 1 20); do
            if ! pgrep -f "${vmms}" > /dev/null; then
              break
            fi

            sleep 0.5
          done

          if pgrep -f "${vmms}" > /dev/null; then
            echo "A VMM did not stop when it was asked to:"
            pgrep -af "${vmms}" || true

            sudo pkill -KILL -f "${vmms}" || true
            sleep 1
          fi

          sudo ip link delete fl-e2e-br0 type bridge || true

          sudo dmsetup remove --force dev-thinpool-e2e || true

          while IFS=: read -r device _; do
            if [[ -n "$device" ]]; then
              sudo losetup -d "$device" || true
            fi
          done < <(losetup -a | grep -E "/var/lib/containerd-dev/snapshotter/devmapper/(data|metadata)-e2e" || true)

          sudo rm -rf \
            /run/containerd-e2e \
            /run/flintlock \
            /var/lib/containerd-e2e \
            /var/lib/containerd-dev/snapshotter/devmapper/data-e2e \
            /var/lib/containerd-dev/snapshotter/devmapper/metadata-e2e \
            /var/lib/flintlock \
            /var/lib/flintlock-e2e
