name: spike 1359

on:
  push:
    branches:
      - spike/1359

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo jq e2fsprogs xfsprogs util-linux binutils curl
      - name: Install Firecracker
        env:
          FIRECRACKER: v1.16.1
        run: sudo -E ./hack/scripts/provision.sh firecracker
      - name: State directory on XFS with reflink
        run: |
          truncate -s 20G /tmp/xfs.img
          mkfs.xfs -q -m reflink=1 /tmp/xfs.img
          sudo mkdir -p /srv/spike
          sudo mount -o loop /tmp/xfs.img /srv/spike
      - name: Run spikes
        run: sudo -E env "PATH=$PATH" ./spike/run.sh
